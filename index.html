<title>Poa Chat — Ongea, Kila Mtu Aelewe</title>
<style>
:root {
  --tanzanite: #6B53A3;
  --tanzanite-dark: #4A3878;
  --tanzanite-light: #9A87C7;
  --gold: #D4A94C;
  --ink: #12141C;
  --paper: #F6F4F1;
  --border: #E8E4DE;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--paper);
  overscroll-behavior-y: contain;
}
button { font-family: inherit; cursor: pointer; border: none; }
input { font-family: inherit; }
#root { min-height: 100vh; }
.screen { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.fade-in { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ---- Auth screen ---- */
.auth-screen {
  min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
  padding: 0 24px; background: linear-gradient(180deg, var(--tanzanite-dark), var(--ink));
}
.auth-wrap { max-width: 380px; margin: 0 auto; width: 100%; }
.auth-logo-block { text-align: center; margin-bottom: 32px; }
.auth-logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px;
  background: var(--gold); color: var(--ink); font-size: 22px; font-weight: 700;
}
.auth-logo-block h1 { color: white; font-size: 24px; font-weight: 700; margin: 0; }
.auth-tag { color: var(--tanzanite-light); font-size: 14px; margin-top: 6px; }
.auth-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
.tab-row { display: flex; margin-bottom: 20px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 10px 0; font-size: 14px; font-weight: 600; color: #888; background: white; }
.tab-btn.active { background: var(--tanzanite); color: white; }
.field-label { display: block; font-size: 12px; font-weight: 500; color: #888; margin-top: 12px; margin-bottom: 4px; }
.field-input {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
  font-size: 15px; outline: none;
}
.field-input:focus { border-color: var(--tanzanite-light); }
.lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.lang-btn { padding: 8px 0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #555; border: 1px solid var(--border); background: white; }
.lang-btn.active { background: var(--tanzanite); color: white; border-color: var(--tanzanite); }
.error-text { color: #e04b4b; font-size: 13px; margin-top: 8px; }
.btn-primary {
  width: 100%; padding: 12px 0; border-radius: 12px; color: var(--ink); font-weight: 700;
  margin-top: 16px; background: var(--gold); font-size: 15px;
}
.btn-primary:disabled { opacity: 0.6; }

/* ---- Chat list ---- */
.chatlist-header { background: var(--tanzanite); color: white; padding: 20px 16px 16px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-shrink: 0; }
.chatlist-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.chatlist-header h1 { font-size: 18px; font-weight: 700; margin: 0; }
.header-sub { font-size: 12px; opacity: 0.85; margin: 2px 0 0; }
.logout-btn { font-size: 12px; background: rgba(255,255,255,0.2); color: white; padding: 6px 14px; border-radius: 999px; }
.search-input { width: 100%; padding: 10px 12px; border-radius: 12px; border: none; font-size: 14px; color: #333; outline: none; }
.list-area { flex: 1; padding: 12px 16px; }
.list-area.scroll { overflow-y: auto; }
.list-hint { font-size: 12px; color: #999; margin-bottom: 8px; }
.empty-state { text-align: center; margin-top: 64px; padding: 0 24px; color: #999; font-size: 14px; }
.empty-state .muted { font-size: 12px; margin-top: 4px; }
.contact-row {
  width: 100%; display: flex; align-items: center; gap: 12px; background: white;
  padding: 12px; border-radius: 14px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(18,20,28,0.06);
  text-align: left; transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.contact-row:active { transform: scale(0.98); box-shadow: 0 1px 2px rgba(18,20,28,0.06); }
.avatar {
  width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--tanzanite-light), var(--tanzanite)); color: white; font-weight: 700;
}
.avatar.big { width: 44px; height: 44px; background: linear-gradient(135deg, var(--tanzanite), var(--tanzanite-dark)); }
.avatar-wrap { position: relative; flex-shrink: 0; }
.online-dot {
  position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; border-radius: 999px;
  background: #3DCB6C; border: 2px solid white;
}
.day-divider { display: flex; justify-content: center; margin: 6px 0; }
.day-divider span {
  background: rgba(0,0,0,0.06); color: #777; font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 999px;
}
.contact-info { flex: 1; min-width: 0; }
.contact-top { display: flex; justify-content: space-between; align-items: baseline; }
.contact-name { font-weight: 600; font-size: 14px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-name.white { color: white; }
.contact-sub { font-size: 12px; color: #999; margin: 2px 0 0; }
.contact-time { font-size: 10px; color: #aaa; flex-shrink: 0; }
.contact-preview { font-size: 12px; color: #999; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- Chat screen ---- */
.chat-header { background: var(--tanzanite); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-shrink: 0; }
.back-btn { background: none; color: white; font-size: 20px; padding: 0; }
.messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.bubble-row { display: flex; justify-content: flex-start; }
.bubble-row.mine { justify-content: flex-end; }
.bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px 18px 18px 4px; background: white; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(18,20,28,0.05); }
.bubble.sent { background: var(--tanzanite); color: white; border-radius: 18px 18px 4px 18px; border: none; box-shadow: 0 2px 6px rgba(107,83,163,0.25); }
.voice-tag { font-size: 10px; opacity: 0.7; margin: 0 0 2px; }
.bubble-text { font-size: 14px; line-height: 1.4; margin: 0; }
.toggle-link { background: none; font-size: 10px; margin-top: 4px; text-decoration: underline; opacity: 0.7; color: inherit; padding: 0; }
.bubble-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.bubble-time { font-size: 9px; opacity: 0.6; }
.speak-btn { background: none; font-size: 11px; opacity: 0.7; margin-left: 8px; padding: 0; color: inherit; }
.bubble-actions { display: flex; gap: 8px; align-items: center; }
.ticks { font-size: 11px; opacity: 0.6; letter-spacing: -1px; }
.ticks.read { color: #7DD3FC; opacity: 1; }
.empty-hint { text-align: center; color: #999; font-size: 14px; margin-top: 40px; }
.recording-hint { text-align: center; font-size: 12px; color: #D64545; padding: 6px 0; background: white; margin: 0; flex-shrink: 0; }
.composer { display: flex; align-items: center; gap: 8px; padding: 12px; background: white; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
.composer-input { flex: 1; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); font-size: 14px; outline: none; }
.mic-btn, .send-btn {
  width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  color: white; flex-shrink: 0; font-size: 16px;
}
.mic-btn { background: var(--gold); color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none; }
.mic-btn.recording { background: #D64545; color: white; animation: pulse 1.2s infinite; }
.send-btn { background: var(--tanzanite); }
.send-btn:disabled { opacity: 0.4; }
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(107,83,163,0.5); }
  50% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(107,83,163,0); }
}
